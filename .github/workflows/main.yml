name: Build MusyFit APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Configure optional AI backend URL
        env:
          MUSYFIT_AI_URL: ${{ secrets.MUSYFIT_AI_URL }}
        run: |
          python3 - <<'PY'
          import os, json
          url=os.environ.get('MUSYFIT_AI_URL','')
          open('app/config.js','w',encoding='utf-8').write('window.MUSYFIT_AI_URL = '+json.dumps(url)+';\n')
          PY
      - name: Create Android project
        run: npx cap add android
      - name: Sync app
        run: npx cap sync android
      - name: Apply MusyFit launcher icon
        run: |
          python3 -m pip install pillow
          python3 scripts/make_android_icon.py
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MusyFit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
